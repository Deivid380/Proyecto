name: quicksale_pos
description: "A Point of Sale application for small businesses. Developed with Flutter."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core packages for QuickSale POS
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Feature packages
  pdf: ^3.11.0
  printing: ^5.12.0
  pdf_google_fonts: ^0.3.0 # Added for Google Fonts with PDF
  image_picker: ^1.1.2
  fl_chart: ^0.68.0
  google_mlkit_barcode_scanning: ^0.11.0
  camera: ^0.11.0+1
  mobile_scanner: ^5.1.1

  cupertino_icons: ^1.0.8
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true